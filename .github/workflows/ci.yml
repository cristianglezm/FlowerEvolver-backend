name: CI

# Runs on pull requests and is also called by cd.yml, so an image is only published after this passed.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  # a name that does not exist on Docker Hub: if compose ever tried to pull it, the job would fail
  # instead of silently testing the published image
  BACKEND_IMAGE: fe-backend:ci

jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      # makes the redis rate limiter tests run instead of being skipped
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests
      env:
        TEST_REDIS_URL: redis://localhost:6379
      run: |
        sh .devops/reset.sh
        export FLASK_APP=manage.py
        flask db check
        python -m pytest

    - name: Run Lint
      run: |
        python -m flake8 --per-file-ignores='app/__init__.py:F401'

  # builds the image of this commit and tests the whole stack with it (nothing is pushed here)
  integration:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build the image of this commit
      uses: docker/build-push-action@v6
      with:
        context: .
        file: dockerfile.alpine
        tags: ${{ env.BACKEND_IMAGE }}
        labels: org.opencontainers.image.revision=${{ github.sha }}
        load: true
        push: false
        cache-from: type=gha,scope=backend
        cache-to: type=gha,scope=backend,mode=max

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements*.txt

    - name: Install the e2e dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Start the stack with the image that was just built
      run: |
        docker compose up -d --no-build --remove-orphans
        docker compose ps

    - name: Check that the app container runs the image of this commit
      run: |
        built=$(docker image inspect "$BACKEND_IMAGE" --format '{{.Id}}')
        running=$(docker inspect app --format '{{.Image}}')
        revision=$(docker inspect app --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
        echo "built:    $built"
        echo "running:  $running"
        echo "revision: $revision (commit ${{ github.sha }})"
        test "$built" = "$running"
        test "$revision" = "${{ github.sha }}"

    - name: Run the e2e tests
      # waits for /health to report database, kafka and redis ok (describe and kafka start slowly)
      run: python tests/e2e/e2e_test.py

    - name: Show the logs when something failed
      if: failure()
      run: |
        docker compose ps -a
        for service in app db kafka describe redis; do
          echo "::group::logs of $service"
          docker compose logs --no-color --tail 200 "$service" || true
          echo "::endgroup::"
        done

    - name: Stop the stack
      if: always()
      run: docker compose down -v
