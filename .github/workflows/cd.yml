name: CD

# Publishes the image, but only when the whole CI (tests, lint, image build and the compose e2e) passed.
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push the image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: dockerfile.alpine
        tags: docker.io/cristianglezm/fe:backend-alpine-dev
        labels: org.opencontainers.image.revision=${{ github.sha }}
        push: true
        # the layers CI just built (same commit), so this does not compile flowerevolver again
        cache-from: type=gha,scope=backend
